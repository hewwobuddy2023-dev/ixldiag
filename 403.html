<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>403 Forbidden</title><style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html{background:#090d10;color:#bfccd2;font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
body{max-width:680px;margin:clamp(48px,12vh,110px) auto;padding:0 25px}
h1{font-size:clamp(22px,5vw,31px);font-weight:500;color:#e0e8eb;margin:0 0 10px}
p{margin:0 0 18px;color:#96a8b0}
.rule{border:0;border-top:1px solid #2d3b42;margin:26px 0 18px}
small{color:#788a93}
input,button{font:inherit;color:#e0e8eb;border:1px solid #425158;border-radius:0;padding:9px 11px;background:#111a1f}
input{width:220px;max-width:62vw;outline-offset:2px}
button{cursor:pointer;margin-left:5px}
button:hover,.hot:hover{background:#1d2b31}
.hot{display:inline-block;min-width:15px;color:#dbe9ef;cursor:pointer;padding:0 3px;text-decoration:none}
#status{display:block;margin-top:17px;min-height:20px}
</style></head><body>
<h1>403 Forbidden</h1>
<p>The server understood the request but refuses to authorize it.</p>
<p>Reference: <a class="hot" id="next" href="./" aria-label="Continue verification">0</a></p>
<small id="status">Access denied.</small><hr class="rule">
<small>No additional information is available.</small>
<script>
(()=>{
 const status=document.getElementById('status');const link=document.getElementById('next');
 const ok=sessionStorage.getItem('dark-error-v2-first')==='1';
 if(!ok){link.removeAttribute('href');link.style.cursor='default';status.textContent='403 - Invalid request.';return;}
 link.addEventListener('click',e=>{e.preventDefault();sessionStorage.removeItem('dark-error-v2-first');sessionStorage.setItem('dark-error-v2-decrypt','1');location.assign('./');});
})();
</script></body></html>
